<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Murid — Tutorin</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="bg-emerald-50/40 text-slate-800 min-h-screen"><main class="max-w-5xl mx-auto p-5 md:p-8"><header class="flex flex-col md:flex-row md:justify-between gap-4 mb-7"><div><p class="text-emerald-700 font-black text-xs uppercase tracking-widest">Tutorin</p><h1 class="text-3xl font-black text-emerald-950">Dashboard Murid</h1><p class="text-slate-500 mt-1">Riwayat TO, hasil pengerjaan, dan analisis kemampuanmu.</p></div><div class="flex gap-2"><a href="./to.html" class="px-4 py-3 rounded-xl bg-white border font-bold">← TO</a><button onclick="logout()" class="px-4 py-3 rounded-xl bg-white border font-bold">Keluar</button></div></header><section id="login" class="bg-white rounded-3xl border p-6 max-w-lg"><h2 class="text-xl font-black">Login Murid</h2><p class="text-sm text-slate-500 mt-1">Gunakan akunmu untuk menyimpan riwayat dan hasil TO.</p><input id="email" type="email" autocomplete="username" class="mt-5 w-full border rounded-xl p-4" placeholder="Email"><input id="password" type="password" autocomplete="current-password" class="mt-3 w-full border rounded-xl p-4" placeholder="Password"><button onclick="login()" class="mt-3 w-full bg-emerald-800 text-white rounded-xl p-4 font-black">MASUK</button><button onclick="signup()" class="mt-3 w-full bg-emerald-50 text-emerald-900 rounded-xl p-4 font-black">DAFTAR AKUN BARU</button><p id="err" class="hidden text-red-600 text-sm font-bold mt-3"></p></section><section id="app" class="hidden"><div class="grid md:grid-cols-3 gap-4 mb-6"><div class="bg-white border rounded-2xl p-5"><p class="text-xs text-slate-500 font-bold">TO DIBELI</p><p id="totalOrders" class="text-3xl font-black text-emerald-900 mt-1">0</p></div><div class="bg-white border rounded-2xl p-5"><p class="text-xs text-slate-500 font-bold">TO DIKERJAKAN</p><p id="totalAttempts" class="text-3xl font-black text-emerald-900 mt-1">0</p></div><div class="bg-white border rounded-2xl p-5"><p class="text-xs text-slate-500 font-bold">RATA-RATA NILAI</p><p id="avgScore" class="text-3xl font-black text-emerald-900 mt-1">—</p></div></div><section class="bg-white border rounded-3xl p-6 mb-6"><h2 class="text-xl font-black">Riwayat Pembelian TO</h2><div id="orders" class="grid gap-3 mt-4"></div></section><section class="bg-white border rounded-3xl p-6"><h2 class="text-xl font-black">Hasil & Analisis</h2><div id="attempts" class="grid gap-4 mt-4"></div></section></section></main><script>
const URL='https://ucdzqedssqblkzhljzgr.supabase.co',KEY='sb_publishable_YAiwu5UGSQydeLVcZSuJAA_6gRMxpKl',sb=window.supabase.createClient(URL,KEY);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
async function login(){const e=document.getElementById('err');e.classList.add('hidden');try{const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)throw error;await load()}catch(x){e.textContent=x.message;e.classList.remove('hidden')}}
async function signup(){const e=document.getElementById('err');e.classList.add('hidden');try{const {data,error}=await sb.auth.signUp({email:email.value.trim(),password:password.value});if(error)throw error;e.textContent=data.session?'Akun dibuat.':'Akun dibuat. Cek email untuk verifikasi lalu login.';e.className='text-emerald-700 text-sm font-bold mt-3';e.classList.remove('hidden')}catch(x){e.textContent=x.message;e.className='text-red-600 text-sm font-bold mt-3';e.classList.remove('hidden')}}
async function logout(){await sb.auth.signOut();location.reload()}
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session)return;loginSectionHide();const uid=session.user.id;const {data:orders,error:oe}=await sb.from('to_orders').select('id,status,created_at,paid_at,to_products(code,name,level,price,path)').eq('user_id',uid).order('created_at',{ascending:false});if(oe)throw oe;const {data:attempts,error:ae}=await sb.from('to_attempts').select('id,started_at,submitted_at,score,correct_count,total_count,analysis,to_products(code,name,level)').eq('user_id',uid).order('created_at',{ascending:false});if(ae)throw ae;document.getElementById('totalOrders').textContent=orders?.length||0;document.getElementById('totalAttempts').textContent=attempts?.length||0;const scores=(attempts||[]).map(x=>Number(x.score)).filter(Number.isFinite);document.getElementById('avgScore').textContent=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'—';document.getElementById('orders').innerHTML=(orders||[]).map(o=>`<article class="border rounded-2xl p-4 flex flex-col md:flex-row md:justify-between gap-3"><div><div class="flex gap-2"><span class="px-2 py-1 rounded-lg bg-emerald-50 text-emerald-800 text-xs font-black">${esc(o.status)}</span><span class="px-2 py-1 rounded-lg bg-slate-100 text-xs font-bold">${esc(o.to_products?.level||'')}</span></div><h3 class="font-black mt-2">${esc(o.to_products?.name)}</h3><p class="text-sm text-slate-500">${money(o.to_products?.price)} · ${new Date(o.created_at).toLocaleString('id-ID')}</p></div><div class="text-sm font-bold text-slate-500">${o.status==='paid'?'✓ Siap digunakan':'Menunggu pembayaran'}</div></article>`).join('')||'<p class="text-slate-500">Belum ada riwayat pembelian.</p>';document.getElementById('attempts').innerHTML=(attempts||[]).map(a=>{const an=a.analysis||{};return `<article class="border rounded-2xl p-5"><div class="flex flex-col md:flex-row md:justify-between gap-3"><div><h3 class="font-black">${esc(a.to_products?.name||'Try Out')}</h3><p class="text-sm text-slate-500">${a.submitted_at?new Date(a.submitted_at).toLocaleString('id-ID'):'Belum selesai'}</p></div><div class="text-right"><div class="text-2xl font-black text-emerald-900">${Number.isFinite(Number(a.score))?Number(a.score).toFixed(1):'—'}</div><div class="text-xs text-slate-500">${a.correct_count??0}/${a.total_count??0} benar</div></div></div><div class="grid sm:grid-cols-3 gap-3 mt-4"><div class="bg-emerald-50 rounded-xl p-3"><p class="text-xs font-bold text-emerald-700">KEKUATAN</p><p class="font-bold mt-1">${esc(an.strengths||'Belum dianalisis')}</p></div><div class="bg-amber-50 rounded-xl p-3"><p class="text-xs font-bold text-amber-700">PERLU DITINGKATKAN</p><p class="font-bold mt-1">${esc(an.weaknesses||'Belum dianalisis')}</p></div><div class="bg-slate-100 rounded-xl p-3"><p class="text-xs font-bold text-slate-600">SARAN</p><p class="font-bold mt-1">${esc(an.recommendation||'Belum dianalisis')}</p></div></div></article>`}).join('')||'<p class="text-slate-500">Belum ada hasil pengerjaan. Kerjakan TO untuk melihat analisis.</p>'}
function loginSectionHide(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}(async()=>{try{await load()}catch(e){const x=document.getElementById('err');x.textContent=e.message;x.className='text-red-600 text-sm font-bold mt-3';x.classList.remove('hidden')}})();
</script></body></html>
