<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin TO — Tutorin</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="bg-slate-100 min-h-screen text-slate-800"><main class="max-w-6xl mx-auto p-5 md:p-8"><div class="flex justify-between gap-4 mb-6"><div><p class="text-emerald-700 font-black text-xs uppercase tracking-widest">Tutorin TKA</p><h1 class="text-3xl font-black">Dashboard Admin TO</h1><p class="text-slate-500">Konfirmasi pembayaran, terbitkan kode, dan kelola order.</p></div><a href="./to.html" class="px-4 py-3 h-fit rounded-xl bg-white border font-bold">← Halaman TO</a></div><section id="login" class="bg-white rounded-3xl p-6 shadow-sm border max-w-lg"><h2 class="text-xl font-black">Login Admin</h2><p class="text-sm text-slate-500 mt-1">Gunakan akun Supabase yang memiliki role admin.</p><input id="adminEmail" type="email" autocomplete="username" class="mt-5 w-full border rounded-xl p-4" placeholder="Email admin"><input id="adminPassword" type="password" autocomplete="current-password" class="mt-3 w-full border rounded-xl p-4" placeholder="Password"><button onclick="loginAdmin()" class="mt-3 w-full bg-emerald-800 text-white rounded-xl p-4 font-black">MASUK</button><p id="loginErr" class="hidden text-red-600 font-bold text-sm mt-3"></p></section><section id="app" class="hidden"><div class="flex flex-wrap gap-3 mb-5"><button onclick="loadOrders()" class="bg-emerald-800 text-white px-5 py-3 rounded-xl font-black">↻ Refresh Order</button><button onclick="logoutAdmin()" class="bg-white border px-5 py-3 rounded-xl font-black">Keluar</button><div id="orderCount" class="bg-white border rounded-xl px-5 py-3 font-bold"></div></div><div id="msg" class="hidden mb-4 p-4 rounded-xl font-bold"></div><div id="orders" class="grid gap-4"></div></section></main><script>
const SUPABASE_URL='https://ucdzqedssqblkzhljzgr.supabase.co';const SUPABASE_KEY='sb_publishable_YAiwu5UGSQydeLVcZSuJAA_6gRMxpKl';const ADMIN_FN=SUPABASE_URL+'/functions/v1/tka-admin';const DELETE_FN=SUPABASE_URL+'/functions/v1/tka-admin-v2';const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function callFn(endpoint,action,extra={}){const {data:{session}}=await supabaseClient.auth.getSession();if(!session)throw Error('Sesi login tidak ditemukan');const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY},body:JSON.stringify({action,...extra})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request gagal');return j}
async function loginAdmin(){const err=document.getElementById('loginErr');err.classList.add('hidden');try{const emailValue=document.getElementById('adminEmail').value.trim();const passwordValue=document.getElementById('adminPassword').value;const {data,error}=await supabaseClient.auth.signInWithPassword({email:emailValue,password:passwordValue});if(error)throw error;if(data.user?.app_metadata?.role!=='admin')throw Error('Akun belum memiliki role admin.');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await loadOrders()}catch(x){err.textContent=x.message;err.classList.remove('hidden')}}
async function logoutAdmin(){await supabaseClient.auth.signOut();location.reload()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return 'Rp'+Number(n||0).toLocaleString('id-ID')}
async function loadOrders(){try{const j=await callFn(ADMIN_FN,'admin_orders');const list=j.orders||[];document.getElementById('orderCount').textContent=list.length+' order';document.getElementById('orders').innerHTML=list.map(o=>`<article class="bg-white rounded-2xl border p-5 shadow-sm"><div class="flex flex-col md:flex-row md:justify-between gap-4"><div><div class="flex gap-2"><span class="px-2 py-1 rounded-lg bg-emerald-50 text-emerald-800 text-xs font-black">${esc(o.status)}</span><span class="px-2 py-1 rounded-lg bg-slate-100 text-xs font-bold">${esc(o.product_code)}</span></div><h3 class="text-lg font-black mt-2">${esc(o.product_name)}</h3><p class="text-sm text-slate-500">${money(o.price)} · ${new Date(o.created_at).toLocaleString('id-ID')}</p><p class="text-xs text-slate-400 mt-2 break-all">Order ID: ${esc(o.id)}</p></div><div class="flex flex-col gap-2 items-start">${o.status==='pending'?`<button onclick="markPaid('${o.id}')" class="bg-emerald-800 text-white px-4 py-3 rounded-xl font-black">✓ Konfirmasi Bayar & Buat Kode</button>`:(o.access_code?`<div class="rounded-xl bg-emerald-50 p-4"><div class="text-xs font-bold text-emerald-700">KODE AKSES</div><div class="text-2xl font-black tracking-widest">${esc(o.access_code)}</div><button onclick="navigator.clipboard.writeText('${esc(o.access_code)}')" class="mt-2 text-xs font-bold underline">Salin</button></div>`:'<span class="text-slate-400 font-bold">Dibayar</span>')}<button onclick="deleteOrder('${o.id}','${o.status}')" class="text-red-600 border border-red-200 px-3 py-2 rounded-xl text-xs font-black">🗑 Hapus Order</button></div></div></article>`).join('')||'<div class="bg-white p-8 rounded-2xl text-slate-500">Belum ada order.</div>'}catch(e){showMessage(e.message,true)}}
async function markPaid(id){if(!confirm('Konfirmasi pembayaran dan buat kode akses?'))return;try{const j=await callFn(ADMIN_FN,'mark_paid',{order_id:id});showMessage('Berhasil. Kode akses: '+j.access_code,false);await loadOrders()}catch(e){showMessage(e.message,true)}}
async function deleteOrder(id,status){const force=status==='paid';const text=force?'Order ini SUDAH PAID. Hapus hanya jika benar-benar diperlukan?':'Hapus order pending ini? Ini cocok untuk order iseng/salah klik.';if(!confirm(text))return;try{await callFn(DELETE_FN,'delete_order',{order_id:id,force_paid:force});showMessage('Order berhasil dihapus.',false);await loadOrders()}catch(e){showMessage(e.message,true)}}
function showMessage(text,bad){const el=document.getElementById('msg');el.textContent=text;el.className=(bad?'bg-red-50 text-red-700':'bg-emerald-50 text-emerald-800')+' mb-4 p-4 rounded-xl font-bold'}
(async()=>{try{const {data:{session}}=await supabaseClient.auth.getSession();if(session?.user?.app_metadata?.role==='admin'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await loadOrders()}}catch(e){console.error(e)}})();
</script></body></html>
